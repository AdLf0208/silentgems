[package]
# Content port of: Silent's Gems 5.2.0 (SilentChaos512/SilentGems, MIT),
# the 26.2 branch. ATM10 ships 5.1.3 for 1.21.1; its gem set is identical
# (5.1.2 added the last five gems) and this slice is content-only. The gem
# registry is a clean-room Rust rewrite; the textures, models and lang are the
# upstream mod's MIT assets, and the port stays local-only until the maintainer
# approves publishing (ARCHITECTURE.md §8).
name = "horizon-silentgems"
version = "5.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Silent's Gems' 21 gems and their storage blocks for Horizon"
publish = false

[lib]
# This exact source is also injected as a same-crate module by horizon-mixins.
path = "mixins/silentgems/runtime.rs"
